name: Günlük AI makale taslağı

# Her gün 05:00 UTC tetiklenir + elle tetikleme. Gerçek çalışma saati her gün
# rastgele 0-5 saat kayar (aşağıdaki "Rastgele gecikme" adımı) — böylece yayın
# saati her gün aynı dakikada olmaz. Script bir makale taslağı üretir ve PR
# açar — yayın için PR'ı incele/merge et. Merge sonrası Netlify/Cloudflare
# Pages otomatik deploy eder.
#
# İçerik 4 sütun arasında sırayla döner (scripts/keyword-research.js ->
# TOPIC_CLUSTERS): 1) Google Ads kampanya yönetimi, 2) Google Ads sahte
# tıklama, 3) İl bazlı web tasarım firmaları, 4) AntiClick tanıtımı.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Makale konusu (boş bırakılırsa AI, sıradaki içerik sütunundan gerçek arama hacmiyle konu seçer)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Rastgele gecikme (yayın saatini her gün değiştir)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$(( RANDOM % 18000 )) # 0-5 saat (saniye) — public repo, Actions dakikası sınırsız/ücretsiz
          echo "Saat çeşitliliği için $DELAY saniye ($((DELAY/60)) dk) bekleniyor..."
          sleep "$DELAY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Anahtar kelime araştırması (konu elle verilmediyse)
        if: ${{ github.event.inputs.topic == '' }}
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/keyword-research.js

      - name: Makale taslağı üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/draft-article.js "${{ github.event.inputs.topic }}"

      - name: Hedef anahtar kelimeyi PR açıklamasına hazırla
        id: kw
        run: |
          if [ -f data/keyword-candidates.json ]; then
            node -e "
              const c = require('./data/keyword-candidates.json')[0];
              if (c) console.log('line=🔑 Hedef anahtar kelime: **' + c.keyword + '** — Türkiye\'de aylık ~' + c.search_volume + ' arama (DataForSEO)' + (c.cluster ? ' — sütun: _' + c.cluster + '_' : ''));
              else console.log('line=');
            " >> "$GITHUB_OUTPUT"
          else
            echo "line=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request aç
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai-makale-taslagi
          delete-branch: true
          commit-message: "İçerik: yeni AI blog makalesi taslağı"
          title: "Yeni blog makalesi taslağı (AI) — inceleme bekliyor"
          body: |
            Bu PR, zamanlanmış iş tarafından üretilen bir **AI makale taslağıdır**.

            ${{ steps.kw.outputs.line }}

            **Yayınlamadan önce kontrol et:**
            - [ ] İçerik doğru ve marka sesine uygun mu?
            - [ ] İç linkler çalışıyor mu, uydurma bilgi var mı?
            - [ ] Başlık/meta description uzunlukları makul mü?

            Onaylıyorsan merge et → Netlify/Cloudflare otomatik deploy eder.
            Beğenmezsen PR'ı kapat (hiçbir şey yayınlanmaz).
